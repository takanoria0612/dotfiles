# Place a copy of this config to ~/.aerospace.toml
# After that, you can edit ~/.aerospace.toml to your liking

# Config version for compatibility and deprecations
config-version = 2

# You can use it to add commands that run after AeroSpace startup.
# Available commands : https://nikitabobko.github.io/AeroSpace/commands
after-startup-command = [
    'exec-and-forget borders active_color=0xff7aa2f7 inactive_color=0xff414868 width=4.0',
    'exec-and-forget sketchybar --reload'
]

# Notify Sketchybar about workspace change
# PREV_WORKSPACE も渡すことで、変更前後の2つのワークスペースのみ更新しパフォーマンス向上
exec-on-workspace-change = [
    '/bin/bash',
    '-c',
    'sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE PREV_WORKSPACE=$AEROSPACE_PREV_WORKSPACE'
]

# Start AeroSpace at login
start-at-login = true

# Normalizations. See: https://nikitabobko.github.io/AeroSpace/guide#normalization
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# See: https://nikitabobko.github.io/AeroSpace/guide#layouts
# The 'accordion-padding' specifies the size of accordion padding
# You can set 0 to disable the padding feature
accordion-padding = 550

# Possible values: tiles|accordion
default-root-container-layout = 'tiles'

# Possible values: horizontal|vertical|auto
# 'auto' means: wide monitor (anything wider than high) gets horizontal orientation,
#               tall monitor (anything higher than wide) gets vertical orientation
default-root-container-orientation = 'auto'

# Mouse follows focus when focused monitor changes
# See https://nikitabobko.github.io/AeroSpace/guide#on-focus-changed-callbacks
# See https://nikitabobko.github.io/AeroSpace/commands#move-mouse
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# You can effectively turn off macOS "Hide application" (cmd-h) feature by toggling this flag
automatically-unhide-macos-hidden-apps = false

# List of workspaces that should stay alive even when they contain no windows
persistent-workspaces = ["1", "2", "3", "4", "5", "T", "I", "C", "O", "B", "P", "Y"]

# A callback that runs every time binding mode changes
on-mode-changed = []

# Possible values: (qwerty|dvorak|colemak)
[key-mapping]
    preset = 'qwerty'

# ワークスペースのモニター割り当て
[workspace-to-monitor-force-assignment]
    I = 'secondary'                                 # ワークスペースIをサブモニター（外部）へ
    1 = 'secondary'
    2 = 'secondary'

# Gaps between windows (inner-*) and between monitor edges (outer-*)
# outer.top: SketchyBar(height=29)との重なり防止のため、モニターごとに調整
[gaps]
    inner.horizontal = 7
    inner.vertical = 7
    outer.left = 7
    outer.bottom = 7
    outer.top = [{ monitor."EV3895" = 45 }, { monitor."U2415" = 45 }, 45]
    outer.right = 7

# 'main' binding mode declaration
[mode.main.binding]

    # See: https://nikitabobko.github.io/AeroSpace/commands#layout
    alt-slash = 'layout tiles horizontal vertical'
    alt-comma = 'layout accordion horizontal vertical'

    alt-o = 'workspace O'   # Obsidian
    alt-shift-o = 'move-node-to-workspace O --focus-follows-window'
    # See: https://nikitabobko.github.io/AeroSpace/commands#focus
    alt-h = [
        'focus --boundaries all-monitors-outer-frame left',
        'move-mouse window-lazy-center'
    ]
    alt-l = [
        'focus --boundaries all-monitors-outer-frame right',
        'move-mouse window-lazy-center'
    ]
    alt-k = 'focus up'
    alt-j = 'focus down'

    alt-n = 'workspace --wrap-around next'

    # See: https://nikitabobko.github.io/AeroSpace/commands#move
    alt-shift-h = 'move left'
    alt-shift-j = 'move down'
    alt-shift-k = 'move up'
    alt-shift-l = 'move right'

    # Alt + Shift + D で、現在のワークスペースを隣のモニターへ飛ばす
    alt-shift-d = 'move-workspace-to-monitor --wrap-around next'

    # See: https://nikitabobko.github.io/AeroSpace/commands#resize
    alt-minus = 'resize smart -50'
    alt-equal = 'resize smart +50'

    # See: https://nikitabobko.github.io/AeroSpace/commands#workspace
    alt-1 = 'workspace 1'
    alt-2 = 'workspace 2'
    alt-3 = 'workspace 3'
    alt-4 = 'workspace 4'
    alt-5 = 'workspace 5'
    alt-t = 'workspace T'
    alt-i = 'workspace I'   # iTerm2
    alt-c = 'workspace C'   # Chrome
    alt-b = 'workspace B'   # Brave
    alt-p = 'workspace P'   # PyCharm
    alt-y = 'workspace Y'

    # See: https://nikitabobko.github.io/AeroSpace/commands#move-node-to-workspace
    # --focus-follows-window: 移動後にそのワークスペースにフォーカスが追従し、
    # SketchyBarの表示も正しく更新される
    alt-shift-1 = 'move-node-to-workspace 1 --focus-follows-window'
    alt-shift-2 = 'move-node-to-workspace 2 --focus-follows-window'
    alt-shift-3 = 'move-node-to-workspace 3 --focus-follows-window'
    alt-shift-4 = 'move-node-to-workspace 4 --focus-follows-window'
    alt-shift-5 = 'move-node-to-workspace 5 --focus-follows-window'
    alt-shift-6 = 'move-node-to-workspace 6 --focus-follows-window'
    alt-shift-7 = 'move-node-to-workspace 7 --focus-follows-window'
    alt-shift-8 = 'move-node-to-workspace 8 --focus-follows-window'
    alt-shift-9 = 'move-node-to-workspace 9 --focus-follows-window'
    alt-shift-t = ['move-node-to-workspace T --focus-follows-window', 'workspace T']
    alt-shift-i = ['move-node-to-workspace I --focus-follows-window', 'workspace I']
    alt-shift-c = 'move-node-to-workspace C --focus-follows-window'
    alt-shift-b = 'move-node-to-workspace B --focus-follows-window'
    alt-shift-p = 'move-node-to-workspace P --focus-follows-window'
    alt-shift-y = 'move-node-to-workspace Y --focus-follows-window'

    # See: https://nikitabobko.github.io/AeroSpace/commands#workspace-back-and-forth
    alt-tab = 'workspace-back-and-forth'
    # See: https://nikitabobko.github.io/AeroSpace/commands#move-workspace-to-monitor
    alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'

    # See: https://nikitabobko.github.io/AeroSpace/commands#mode
    alt-shift-semicolon = 'mode service'

    # --- モニター間移動 (Move Node to Monitor) ---
    alt-shift-left  = 'move-node-to-monitor --wrap-around --focus-follows-window left'
    alt-shift-down  = 'move-node-to-monitor --wrap-around --focus-follows-window down'
    alt-shift-up    = 'move-node-to-monitor --wrap-around --focus-follows-window up'
    alt-shift-right = 'move-node-to-monitor --wrap-around --focus-follows-window right'
    alt-shift-m     = 'move-node-to-monitor --wrap-around --focus-follows-window next'

# --- on-window-detected コールバック ---
# 各ブロックは [[on-window-detected]] で始め、if.* / run をインデントする

[[on-window-detected]]
    if.app-id = 'md.obsidian'
    run = 'move-node-to-workspace O'
[[on-window-detected]]
    if.app-id = 'com.googlecode.iterm2'
    run = 'move-node-to-workspace I'

[[on-window-detected]]
    if.app-id = 'com.apple.systempreferences'
    run = 'layout floating'

[[on-window-detected]]
    if.app-id = 'com.apple.ActivityMonitor'
    run = 'layout floating'

[[on-window-detected]]
    if.app-id = 'com.apple.finder'
    run = 'layout floating'

[[on-window-detected]]
    if.app-id = 'com.microsoft.teams2'
    run = 'move-node-to-workspace T'

[[on-window-detected]]
    if.app-id = 'com.google.Chrome'
    run = 'move-node-to-workspace C'

[[on-window-detected]]
    if.app-id = 'com.brave.Browser'
    run = 'move-node-to-workspace B'

[[on-window-detected]]
    if.app-id = 'com.jetbrains.pycharm.ce'
    run = 'move-node-to-workspace P'

[[on-window-detected]]
    if.app-id = 'com.google.Chrome.app.agimnkijcaahngcdmfeangaknmldooml'
    run = 'move-node-to-workspace Y'

# 'service' binding mode declaration
[mode.service.binding]
    esc = ['reload-config', 'mode main']
    r = ['flatten-workspace-tree', 'mode main'] # reset layout
    f = ['layout floating tiling', 'mode main'] # Toggle between floating and tiling layout
    backspace = ['close-all-windows-but-current', 'mode main']

    alt-shift-h = ['join-with left', 'mode main']
    alt-shift-j = ['join-with down', 'mode main']
    alt-shift-k = ['join-with up', 'mode main']
    alt-shift-l = ['join-with right', 'mode main']
